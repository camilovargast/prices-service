<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="flechaAzul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6F8F"/>
    </marker>
    <marker id="flechaVerde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4F7343"/>
    </marker>
    <marker id="flechaNaranja" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B4601F"/>
    </marker>
    <marker id="flechaGris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A8178"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="760" fill="#FBFAF8"/>

  <text x="700" y="44" text-anchor="middle" font-size="19" font-weight="600" fill="#2B2B2B">Prices Service · arquitectura hexagonal</text>
  <text x="700" y="68" text-anchor="middle" font-size="13" fill="#6B6259">Puertos y adaptadores. Toda dependencia de código apunta hacia el centro.</text>

  <!-- ===================== HEXAGONO ===================== -->
  <polygon points="860,288 700,195 540,288 540,472 700,565 860,472"
           fill="#F3F0EA" stroke="#4A443C" stroke-width="2.5"/>

  <text x="700" y="232" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="1.6" fill="#8A8178">APLICACIÓN</text>
  <text x="700" y="256" text-anchor="middle" font-size="13" font-weight="600" fill="#2B2B2B">FindApplicablePriceService</text>
  <text x="700" y="274" text-anchor="middle" font-size="10.5" fill="#6B6259">caso de uso</text>

  <text x="700" y="428" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="1.6" fill="#8A8178">DOMINIO</text>
  <text x="700" y="452" text-anchor="middle" font-size="13" font-weight="600" fill="#2B2B2B">Price · DateRange · Money</text>
  <text x="700" y="472" text-anchor="middle" font-size="12" fill="#2B2B2B">PriceNotFoundException</text>
  <text x="700" y="500" text-anchor="middle" font-size="10.5" font-style="italic" fill="#8A8178">sin Spring · sin JPA · sin Jackson</text>

  <!-- ===================== PUERTOS ===================== -->
  <rect x="455" y="331" width="170" height="58" rx="7" fill="#FFFFFF" stroke="#B4601F" stroke-width="2"/>
  <text x="540" y="352" text-anchor="middle" font-size="9" font-weight="700" letter-spacing="1.1" fill="#B4601F">PUERTO DE ENTRADA</text>
  <text x="540" y="371" text-anchor="middle" font-size="10.5" font-weight="600" fill="#2B2B2B">FindApplicable-</text>
  <text x="540" y="383" text-anchor="middle" font-size="10.5" font-weight="600" fill="#2B2B2B">PriceUseCase</text>

  <rect x="775" y="331" width="170" height="58" rx="7" fill="#FFFFFF" stroke="#B4601F" stroke-width="2"/>
  <text x="860" y="352" text-anchor="middle" font-size="9" font-weight="700" letter-spacing="1.1" fill="#B4601F">PUERTO DE SALIDA</text>
  <text x="860" y="374" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2B2B2B">PriceRepository</text>

  <!-- ===================== ADAPTADORES PRIMARIOS ===================== -->
  <text x="290" y="278" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1.3" fill="#2F6F8F">ADAPTADORES PRIMARIOS · DRIVING</text>

  <rect x="165" y="292" width="255" height="86" rx="8" fill="#FFFFFF" stroke="#2F6F8F" stroke-width="1.8"/>
  <text x="292" y="313" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2B2B2B">PriceController</text>
  <text x="292" y="332" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2B2B2B">RestExceptionHandler</text>
  <text x="292" y="351" text-anchor="middle" font-size="11.5" fill="#2B2B2B">PriceResponse</text>
  <text x="292" y="369" text-anchor="middle" font-size="9.5" font-style="italic" fill="#8A8178">HTTP → PriceQuery</text>

  <rect x="165" y="398" width="255" height="52" rx="8" fill="#FFFFFF" stroke="#2F6F8F" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text x="292" y="419" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2B2B2B">PriceControllerIT</text>
  <text x="292" y="437" text-anchor="middle" font-size="9.5" font-style="italic" fill="#8A8178">el test también es un adaptador</text>

  <rect x="30" y="310" width="105" height="52" rx="26" fill="#EDF3F7" stroke="#2F6F8F" stroke-width="1.5"/>
  <text x="82" y="333" text-anchor="middle" font-size="11" font-weight="600" fill="#2B2B2B">Cliente</text>
  <text x="82" y="350" text-anchor="middle" font-size="9.5" fill="#6B6259">curl · navegador</text>

  <!-- ===================== ADAPTADORES SECUNDARIOS ===================== -->
  <text x="1110" y="278" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1.3" fill="#4F7343">ADAPTADORES SECUNDARIOS · DRIVEN</text>

  <rect x="980" y="292" width="260" height="86" rx="8" fill="#FFFFFF" stroke="#4F7343" stroke-width="1.8"/>
  <text x="1110" y="313" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2B2B2B">PriceRepositoryAdapter</text>
  <text x="1110" y="332" text-anchor="middle" font-size="11.5" fill="#2B2B2B">PriceJpaRepository</text>
  <text x="1110" y="351" text-anchor="middle" font-size="11.5" fill="#2B2B2B">PriceEntity · PriceEntityMapper</text>
  <text x="1110" y="369" text-anchor="middle" font-size="9.5" font-style="italic" fill="#8A8178">PriceEntity → Price</text>

  <rect x="980" y="398" width="260" height="52" rx="8" fill="#FFFFFF" stroke="#4F7343" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text x="1110" y="419" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2B2B2B">lambda del test unitario</text>
  <text x="1110" y="437" text-anchor="middle" font-size="9.5" font-style="italic" fill="#8A8178">mismo puerto, sin base de datos</text>

  <path d="M 1290 322 a 34 11 0 0 1 68 0 l 0 46 a 34 11 0 0 1 -68 0 z" fill="#EFF4EC" stroke="#4F7343" stroke-width="1.5"/>
  <path d="M 1290 322 a 34 11 0 0 0 68 0" fill="none" stroke="#4F7343" stroke-width="1.5"/>
  <text x="1324" y="352" text-anchor="middle" font-size="11" font-weight="600" fill="#2B2B2B">H2</text>
  <text x="1324" y="386" text-anchor="middle" font-size="9" fill="#6B6259">en memoria</text>

  <!-- ===================== FLECHAS ===================== -->
  <line x1="135" y1="336" x2="160" y2="336" stroke="#2F6F8F" stroke-width="1.8" marker-end="url(#flechaAzul)"/>
  <line x1="420" y1="336" x2="450" y2="345" stroke="#2F6F8F" stroke-width="2" marker-end="url(#flechaAzul)"/>
  <line x1="420" y1="424" x2="450" y2="380" stroke="#2F6F8F" stroke-width="2" marker-end="url(#flechaAzul)"/>
  <text x="437" y="316" text-anchor="middle" font-size="9" fill="#2F6F8F">invoca</text>

  <line x1="625" y1="360" x2="668" y2="360" stroke="#B4601F" stroke-width="2" marker-end="url(#flechaNaranja)"/>
  <line x1="732" y1="360" x2="770" y2="360" stroke="#B4601F" stroke-width="2" marker-end="url(#flechaNaranja)"/>
  <text x="700" y="356" text-anchor="middle" font-size="9.5" font-weight="600" fill="#4A443C">caso</text>
  <text x="700" y="368" text-anchor="middle" font-size="9.5" font-weight="600" fill="#4A443C">de uso</text>

  <line x1="975" y1="345" x2="948" y2="352" stroke="#4F7343" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#flechaVerde)"/>
  <line x1="975" y1="424" x2="948" y2="382" stroke="#4F7343" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#flechaVerde)"/>
  <text x="962" y="316" text-anchor="middle" font-size="9" fill="#4F7343">implementa</text>

  <line x1="1240" y1="345" x2="1285" y2="345" stroke="#4F7343" stroke-width="1.8" marker-end="url(#flechaVerde)"/>
  <text x="1262" y="338" text-anchor="middle" font-size="8.5" fill="#4F7343">SQL</text>

  <!-- ===================== CABLEADO ===================== -->
  <rect x="520" y="612" width="360" height="56" rx="8" fill="#FFFFFF" stroke="#8A8178" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="700" y="634" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2B2B2B">UseCaseConfiguration</text>
  <text x="700" y="653" text-anchor="middle" font-size="9.5" font-style="italic" fill="#8A8178">cablea el caso de uso con el adaptador · @Configuration</text>

  <line x1="640" y1="612" x2="672" y2="572" stroke="#8A8178" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#flechaGris)"/>
  <line x1="880" y1="628" x2="1060" y2="460" stroke="#8A8178" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#flechaGris)"/>

  <!-- ===================== LEYENDA ===================== -->
  <line x1="60" y1="628" x2="100" y2="628" stroke="#4A443C" stroke-width="2"/>
  <text x="110" y="632" font-size="10.5" fill="#4A443C">llamada en ejecución</text>
  <line x1="60" y1="652" x2="100" y2="652" stroke="#4A443C" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="110" y="656" font-size="10.5" fill="#4A443C">dependencia en compilación</text>

  <text x="60" y="700" font-size="11" font-weight="600" fill="#B4601F">La inversión de dependencia está en el puerto de salida:</text>
  <text x="60" y="718" font-size="11" fill="#4A443C">el caso de uso lo llama, la infraestructura lo implementa. Las dos flechas van en sentidos opuestos.</text>
</svg>
